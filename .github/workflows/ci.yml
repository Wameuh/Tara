name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency security audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.8.0
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Export locked runtime dependencies
        run: |
          mkdir -p reports
          uv export --frozen --no-dev --extra deploy --no-hashes \
            --format requirements-txt --output-file reports/runtime-requirements.txt
      - name: Audit Python dependencies
        id: python-audit
        continue-on-error: true
        run: >-
          uvx --python 3.13 --from pip-audit==2.10.1 pip-audit
          --requirement reports/runtime-requirements.txt
          --format json
          --output reports/python-audit.json
      - name: Audit frontend dependencies
        id: node-audit
        continue-on-error: true
        working-directory: webinterface/frontend
        run: npm audit --audit-level=high --json > ../../reports/npm-audit.json
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: |
            reports/python-audit.json
            reports/npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce dependency audit results
        if: always()
        env:
          NODE_AUDIT_OUTCOME: ${{ steps.node-audit.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python-audit.outcome }}
        run: |
          test "$PYTHON_AUDIT_OUTCOME" = success
          test "$NODE_AUDIT_OUTCOME" = success

  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.8.0
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Lint the maintained web surface
        run: >-
          uv run ruff check
          src/tara_web
          tests/web/test_ci_static.py
          scripts/generate_web_openapi.py
          scripts/generate_i18n_manifest.py
          scripts/docker_preflight.py
          docker/healthcheck.py
      - name: Run the Python test suite
        run: |
          umask 077
          uv run pytest --junitxml=reports/python-tests.xml
      - name: Upload the Python test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-report
          path: reports/python-tests.xml
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webinterface/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.8.0
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Install locked Python dependencies
        working-directory: .
        run: uv sync --frozen --extra dev --extra deploy
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run frontend checks
        run: npm run check

  e2e-chromium:
    name: Chromium end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webinterface/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e -- --project=chromium
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-chromium-report
          path: webinterface/frontend/playwright-report
          if-no-files-found: error
          retention-days: 14

  container:
    name: Production container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the Compose model
        run: docker compose config --quiet
      - name: Build the production image
        env:
          OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          OCI_REVISION: ${{ github.sha }}
        run: >-
          docker build
          --build-arg OCI_SOURCE="$OCI_SOURCE"
          --build-arg OCI_REVISION="$OCI_REVISION"
          --build-arg OCI_VERSION=ci
          --tag tara-web:ci
          .
