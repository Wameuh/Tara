name: Release verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-matrix:
    name: Cross-browser and mobile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webinterface/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-release-report
          path: webinterface/frontend/playwright-report
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    name: Build and smoke-test the release image
    needs: browser-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the Compose model
        run: docker compose config --quiet
      - name: Run the hardened Compose smoke test
        env:
          TARA_OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          TARA_OCI_REVISION: ${{ github.sha }}
          TARA_OCI_VERSION: ${{ github.ref_name }}
        run: scripts/smoke-web-compose.sh
