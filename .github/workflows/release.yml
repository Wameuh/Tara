name: Release verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-gate:
    name: Reproducible 5+25 load gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.13.14
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.8.0
          enable-cache: true
      - name: Install locked load-test dependencies
        run: uv sync --frozen --extra dev
      - name: Run the provider-free load gate
        run: |
          umask 077
          mkdir -p reports
          uv run pytest tests/web/load/test_mvp_load.py \
            --junitxml=reports/web-load.xml \
            --durations=1
      - name: Upload the load report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-load-report
          path: reports/web-load.xml
          if-no-files-found: error
          retention-days: 14

  browser-matrix:
    name: Cross-browser and mobile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webinterface/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-release-report
          path: webinterface/frontend/playwright-report
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    name: Build and smoke-test the release image
    needs: [load-gate, browser-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: webinterface/frontend/package-lock.json
      - name: Install locked browser dependencies
        working-directory: webinterface/frontend
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Validate the Compose model
        run: docker compose config --quiet
      - name: Run the hardened Compose smoke test
        env:
          TARA_OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          TARA_OCI_REVISION: ${{ github.sha }}
          TARA_OCI_VERSION: ${{ github.ref_name }}
        run: scripts/smoke-web-compose.sh
      - name: Run the real audio browser journey
        env:
          TARA_OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          TARA_OCI_REVISION: ${{ github.sha }}
          TARA_OCI_VERSION: ${{ github.ref_name }}
        run: python scripts/smoke_real_audio_compose.py --playwright
      - name: Generate the release image SBOM
        id: image-sbom
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image --format spdx-json \
            --output /reports/image.spdx.json tara-web:local
      - name: Scan the release image
        id: image-scan
        continue-on-error: true
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format json --output /reports/image-vulnerabilities.json \
            tara-web:local
      - name: Upload image security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-security-reports
          path: |
            reports/image.spdx.json
            reports/image-vulnerabilities.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce image security results
        if: always()
        env:
          IMAGE_SBOM_OUTCOME: ${{ steps.image-sbom.outcome }}
          IMAGE_SCAN_OUTCOME: ${{ steps.image-scan.outcome }}
        run: |
          test "$IMAGE_SBOM_OUTCOME" = success
          test "$IMAGE_SCAN_OUTCOME" = success
