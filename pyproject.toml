[project]
name = "tara"
version = "0.1.0"
description = "Standalone Tara blackboard analysis application."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.12",
  "requests>=2.32",
  "uvicorn>=0.32",
]

[project.scripts]
tara = "tara.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]
