# Portable Tara engine configuration for the Docker web worker.
transcription:
  inference_endpoint: http://host.docker.internal:8000
  inference_auth_provider: none
  request_timeout_seconds: 1800
  streaming_enabled: true
  parallelism: 3
  modal_max_audio_bytes: 1073741824
  modal_max_containers: 3
  modal_files_per_container: 2
  modal_queue_grace_seconds: 1800
  modal_usd_per_second: "0.000306"
analysis:
  enabled: true
  pipeline: blackboard_v1
  output_dir: analysis
  parallel: true
  parallelism: 4
  prompt_security:
    enabled: true
    minimum_score: 80
    max_chars_per_request: 60000
    model: Auto
  llm:
    backend: cursor_cli
    model: Auto
    default_pricing_model: composer-2.5
    usd_to_eur_rate: "0.92"
    pricing_per_million_tokens:
      composer-2.5:
        input_usd: 0.5
        cached_input_usd: 0.2
        output_usd: 2.5
    timeout_seconds: 900
    retries: 2
    cursor_command: cursor-agent
    cursor_args:
      - -p
    cursor_cli_probe: true
