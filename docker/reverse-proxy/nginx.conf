limit_req_zone $binary_remote_addr zone=tara_api_per_ip:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=tara_connections_per_ip:10m;

server {
  listen 8443 ssl;
  server_name _;
  server_tokens off;

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  access_log off;
  client_max_body_size 8m;
  client_body_timeout 30s;
  large_client_header_buffers 4 8k;
  proxy_intercept_errors on;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn tara_connections_per_ip 20;
  error_page 502 503 504 =503 /maintenance.html;

  location = /maintenance.html {
    internal;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
  }

  location = /docs { return 404; }
  location = /openapi.json { return 404; }
  location ^~ /api/v1/metrics { return 404; }

  location ~ ^/api/v1/jobs/[A-Za-z0-9_-]+/events$ {
    if (-f /maintenance/enabled) { return 503; }
    limit_req zone=tara_api_per_ip burst=10 nodelay;
    proxy_pass http://tara-web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location / {
    if (-f /maintenance/enabled) { return 503; }
    limit_req zone=tara_api_per_ip burst=30 nodelay;
    proxy_pass http://tara-web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
