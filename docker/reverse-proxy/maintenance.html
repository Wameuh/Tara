<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="refresh" content="30">
    <title>Maintenance en cours · Tara</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17343d; background: #edf5f5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #fff 0, #edf5f5 58%); }
      main { width: min(620px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid #c9dcde; border-radius: 24px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(23,52,61,.12); text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 50%; background: #dbecef; color: #24636f; font-size: 28px; }
      h1 { margin: 0 0 16px; font-family: Georgia, serif; font-size: clamp(32px, 7vw, 52px); font-weight: 500; letter-spacing: -.035em; }
      p { margin: 0; color: #526d74; font-size: 17px; line-height: 1.65; }
      small { display: block; margin-top: 24px; color: #71878c; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↻</div>
      <h1>Maintenance en cours</h1>
      <p>Tara est en cours de mise à jour. Le service sera de nouveau disponible dans quelques instants.</p>
      <small>Cette page se rafraîchit automatiquement.</small>
    </main>
  </body>
</html>
