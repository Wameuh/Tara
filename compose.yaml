services:
  tara-web-init:
    image: tara-web:local
    build: .
    user: "0:0"
    read_only: true
    privileged: false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/runtime /data/backups && chown -R 0:0 /data && chmod 700 /data /data/runtime /data/backups && chown -R 10001:10001 /data"]
    volumes: [tara_web_data:/data]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    network_mode: none
    pids_limit: 32
    mem_limit: ${TARA_WEB_INIT_MEM_LIMIT:-64m}
    cpus: ${TARA_WEB_INIT_CPUS:-0.25}

  tara-web:
    image: tara-web:local
    user: "10001:10001"
    init: true
    read_only: true
    privileged: false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      tara-web-init: { condition: service_completed_successfully }
    environment:
      TARA_WEB_STORAGE_ROOT: /data/runtime
      TARA_WEB_BACKUPS_ROOT: /data/backups
      TARA_WEB_SQLITE_PATH: /data/runtime/tara-web.sqlite3
      TARA_WEB_PUBLIC_URL: ${TARA_WEB_PUBLIC_URL:-http://localhost:8080}
      TARA_WEB_TARA_CONFIG: /config/tara.yaml
      TARA_INFERENCE_ENDPOINT: ${TARA_INFERENCE_ENDPOINT:-http://host.docker.internal:8000}
      TARA_INFERENCE_AUTH_PROVIDER: ${TARA_INFERENCE_AUTH_PROVIDER:-none}
      TARA_TRANSCRIPTION_PARALLELISM: ${TARA_TRANSCRIPTION_PARALLELISM:-3}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    volumes:
      - ./config/webinterface.yaml:/config/webinterface.yaml:ro
      - ./config/tara-web.yaml:/config/tara.yaml:ro
      - tara_web_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [tara_internal, tara_provider]
    stop_grace_period: 45s
    pids_limit: ${TARA_WEB_PIDS_LIMIT:-256}
    mem_limit: ${TARA_WEB_MEM_LIMIT:-2g}
    cpus: ${TARA_WEB_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/live'); urlopen('http://127.0.0.1:8000/api/v1/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tara-proxy:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    user: "101:101"
    read_only: true
    privileged: false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      tara-web: { condition: service_healthy }
    ports: ["127.0.0.1:${TARA_WEB_HOST_PORT:-8080}:8080"]
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [tara_internal, tara_public]
    stop_grace_period: 10s
    pids_limit: ${TARA_PROXY_PIDS_LIMIT:-64}
    mem_limit: ${TARA_PROXY_MEM_LIMIT:-256m}
    cpus: ${TARA_PROXY_CPUS:-0.5}

volumes:
  tara_web_data:

networks:
  tara_internal:
    internal: true
    ipam:
      config:
        - subnet: ${TARA_WEB_INTERNAL_SUBNET:-172.29.0.0/29}
  tara_public:
  tara_provider:
